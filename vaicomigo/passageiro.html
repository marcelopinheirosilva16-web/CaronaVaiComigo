<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>VaiComigo - Área do Passageiro</title>

  <link
    rel="stylesheet"
    href="css/style.css">


  <!-- ==================================================
       LEAFLET - MAPA
       ================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


  <style>

    /* ==================================================
       MAPA DO PASSAGEIRO
       ================================================== */

    #mapa-passageiro {

      width: 100%;
      height: 380px;

      margin-top: 14px;

      border-radius: 14px;

      overflow: hidden;

      border: 1px solid #e0e4ea;

      box-shadow: 0 6px 20px rgba(20,40,80,.08);

      background: #eef2f7;

    }


    /* ==================================================
       RASTREAMENTO
       ================================================== */

    .rastreamento {

      margin-top: 15px;

      padding: 14px;

      border-radius: 10px;

      background: #f5f7fa;

      border: 1px solid #e0e4ea;

    }


    .rastreamento-online {

      color: #16803c;

      font-weight: bold;

    }


    .rastreamento-offline {

      color: #777;

    }


    .rastreamento-info {

      margin-top: 7px;

      font-size: 13px;

      color: #666;

    }


    /* ==================================================
       BOTÃO VOLTAR
       ================================================== */

    .voltar-painel {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      margin-bottom: 18px;

      padding: 9px 14px;

      border-radius: 9px;

      border: 1px solid #1565c0;

      background: #fff;

      color: #1565c0;

      font-weight: 700;

      text-decoration: none;

      transition: .15s;

    }


    .voltar-painel:hover {

      background: #1565c0;

      color: #fff;

    }


    /* ==================================================
       CABEÇALHO
       ================================================== */

    .pagina-titulo {

      margin-bottom: 18px;

    }


    .pagina-titulo h2 {

      color: #0d47a1;

      margin-bottom: 5px;

    }


    .pagina-titulo p {

      color: #6b7684;

      font-size: .9rem;

    }


    /* ==================================================
       ESTRELAS
       ================================================== */

    .estrelas {

      display: flex;

      gap: 8px;

      margin: 14px 0;

    }


    .estrelas span {

      font-size: 34px;

      color: #cfd5dc;

      cursor: pointer;

      transition: .15s;

      user-select: none;

    }


    .estrelas span:hover {

      transform: scale(1.08);

    }


    .estrelas span.ativo {

      color: #f5b301;

    }


    .rotulo {

      color: #6b7684;

      font-size: .9rem;

    }


    /* ==================================================
       CARDS DAS VIAGENS
       ================================================== */

    #resultados .card {

      transition: .15s;

    }


    #resultados .card:hover {

      transform: translateY(-2px);

    }


    /* ==================================================
       BOTÃO CENTRALIZAR
       ================================================== */

    .btn-centralizar {

      width: 100%;

      margin-top: 10px;

    }


    /* ==================================================
       RESPONSIVO
       ================================================== */

    @media(max-width:600px){

      #mapa-passageiro {

        height: 320px;

      }


      .estrelas span {

        font-size: 30px;

      }

    }

  </style>

</head>


<body>


  <!-- ==================================================
       NAVBAR
       ================================================== -->

  <div class="navbar">

    <div class="wrap">

      <div class="brand">

        <img
          src="img/logo.jpg"
          alt="VaiComigo"
          class="brand-logo">

      </div>

      <nav id="menu"></nav>

    </div>

  </div>



  <!-- ==================================================
       CONTEÚDO
       ================================================== -->

  <div class="container">


    <!-- VOLTAR -->

    <a
      href="painel.html"
      class="voltar-painel">

      ← Voltar ao painel

    </a>



    <!-- TÍTULO -->

    <div class="pagina-titulo">

      <h2>
        👤 Área do Passageiro
      </h2>

      <p>
        Encontre uma carona que combine
        com seu trajeto.
      </p>

    </div>



    <!-- ==================================================
         PESQUISA
         ================================================== -->

    <div class="card">

      <h3>
        🔎 Pesquisar caronas
      </h3>


      <div
        class="grid cols-3"
        style="gap:10px">


        <!-- ORIGEM -->

        <div class="form-group">

          <label for="f-origem">
            Origem
          </label>

          <input
            type="text"
            id="f-origem"
            placeholder="De onde você vai?">

        </div>


        <!-- DESTINO -->

        <div class="form-group">

          <label for="f-destino">
            Destino
          </label>

          <input
            type="text"
            id="f-destino"
            placeholder="Para onde você vai?">

        </div>


        <!-- DATA -->

        <div class="form-group">

          <label for="f-data">
            Data
          </label>

          <input
            type="date"
            id="f-data">

        </div>

      </div>



      <div
        class="grid cols-3"
        style="gap:10px">


        <!-- VAGAS -->

        <div class="form-group">

          <label for="f-vagas">
            Vagas mínimas
          </label>

          <input
            type="number"
            id="f-vagas"
            min="1"
            value="1">

        </div>


        <!-- VALOR -->

        <div class="form-group">

          <label for="f-valor">
            Contribuição máxima (R$)
          </label>

          <input
            type="number"
            id="f-valor"
            min="0"
            step="0.01"
            placeholder="Sem limite">

        </div>


        <!-- BOTÕES -->

        <div
          class="form-group"
          style="display:flex;align-items:flex-end;gap:8px">


          <button
            type="button"
            class="btn block"
            onclick="buscarViagens()">

            🔎 Buscar

          </button>


          <button
            type="button"
            class="btn"
            onclick="limparFiltrosPassageiro()">

            Limpar

          </button>


        </div>

      </div>

    </div>



    <!-- ==================================================
         RESULTADOS
         ================================================== -->

    <div
      id="resultados"
      class="grid cols-2"
      style="margin-top:18px">

      <p class="vazio">

        Use os filtros acima para encontrar
        caronas.

      </p>

    </div>


  </div>



  <!-- ==================================================
       MODAL DETALHES DA VIAGEM
       ================================================== -->

  <div
    class="modal"
    id="modal-det">


    <div class="box">


      <button
        type="button"
        class="fechar"
        onclick="fecharDetalhesPassageiro()">

        &times;

      </button>


      <!-- ==================================================
           DETALHES DA VIAGEM
           ================================================== -->

      <div
        id="det-conteudo">

      </div>



      <!-- ==================================================
           ACOMPANHAMENTO DA VIAGEM
           ================================================== -->

      <div
        id="rastreamento-passageiro"
        class="rastreamento rastreamento-offline"
        style="display:none;">

        <div
          style="
            font-weight:700;
            margin-bottom:6px;
          ">

          📍 Acompanhamento da viagem

        </div>


        <div
          id="rastreamento-info"
          class="rastreamento-info">

          Aguardando início da viagem...

        </div>


        <!-- ==================================================
             MAPA
             ================================================== -->

        <div
          id="mapa-passageiro">

        </div>


        <!-- ==================================================
             CENTRALIZAR MOTORISTA
             ================================================== -->

        <button
          type="button"
          class="btn btn-centralizar"
          onclick="centralizarMotoristaPassageiro()">

          🎯 Centralizar motorista

        </button>

      </div>


    </div>

  </div>



  <!-- ==================================================
       MODAL AVALIAÇÃO
       ================================================== -->

  <div
    class="modal"
    id="modal-aval">


    <div class="box">


      <button
        type="button"
        class="fechar"
        onclick="fecharModal('modal-aval')">

        &times;

      </button>


      <h3>
        ⭐ Avaliar experiência
      </h3>


      <div
        class="estrelas"
        id="estrelas">


        <span
          data-n="1"
          onclick="selecionarEstrela(1)">
          &#9733;
        </span>


        <span
          data-n="2"
          onclick="selecionarEstrela(2)">
          &#9733;
        </span>


        <span
          data-n="3"
          onclick="selecionarEstrela(3)">
          &#9733;
        </span>


        <span
          data-n="4"
          onclick="selecionarEstrela(4)">
          &#9733;
        </span>


        <span
          data-n="5"
          onclick="selecionarEstrela(5)">
          &#9733;
        </span>


      </div>


      <div class="rotulo">

        Toque nas estrelas para dar sua nota.

      </div>



      <div
        class="form-group"
        style="margin-top:12px">

        <label for="aval-coment">

          Comentário (opcional)

        </label>

        <textarea
          id="aval-coment"
          placeholder="Conte como foi sua experiência..."></textarea>

      </div>



      <button
        type="button"
        class="btn verde block"
        onclick="enviarAvaliacao()">

        ⭐ Enviar avaliação

      </button>


    </div>

  </div>



  <!-- ==================================================
       TOAST
       ================================================== -->

  <div
    id="toast"
    class="toast">

  </div>



  <!-- ==================================================
       FIREBASE
       ================================================== -->

  <script
    src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js">
  </script>


  <script
    src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js">
  </script>


  <script
    src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js">
  </script>



  <!-- ==================================================
       LEAFLET
       ================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>



  <!-- ==================================================
       FIREBASE CONFIG
       ================================================== -->

  <script
    src="js/firebase-config.js">
  </script>



  <!-- ==================================================
       FUNÇÕES GERAIS
       ================================================== -->

  <script
    src="js/common.js">
  </script>



  <!-- ==================================================
       NAVEGAÇÃO
       ================================================== -->

  <script
    src="js/nav.js">
  </script>



  <!-- ==================================================
       RASTREAMENTO
       ================================================== -->

  <script
    src="js/rastreamento-passageiro.js">
  </script>



  <!-- ==================================================
       ÁREA DO PASSAGEIRO
       ================================================== -->

  <script
    src="js/passageiro.js">
  </script>


</body>

</html>
